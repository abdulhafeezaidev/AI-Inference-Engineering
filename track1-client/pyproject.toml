[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "track1-client"
version = "0.1.0"
description = "AI Inference Engineering client and configuration toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [    "httpx>=0.27.0",
"pytest-asyncio>=0.24.0",
]

[project.scripts]
infer-config = "inference_client.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"